[package]
name = "hearthwork"
version = "0.1.0"
description = "A city that only lives while you work."
edition = "2021"
rust-version = "1.77"

[lib]
# staticlib and cdylib are what the iOS and Android builds link against later.
name = "hearthwork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
